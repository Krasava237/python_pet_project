server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass http://backend:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8001/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://backend:8001/robots.txt;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8001/sitemap.xml;
    }

    # Для известных клиентских маршрутов отдаем index.html, а все прочие URL завершаем реальным 404.
    location = / {
        try_files /index.html =404;
    }

    location = /login {
        try_files /index.html =404;
    }

    location = /me {
        try_files /index.html =404;
    }

    location = /admin {
        try_files /index.html =404;
    }

    location = /pets {
        try_files /index.html =404;
    }

    location ~ ^/pets/[0-9]+-[a-z0-9-]+$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
