name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: petfinder_test
          POSTGRES_USER: petfinder
          POSTGRES_PASSWORD: petfinder_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petfinder -d petfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: petfinder
      DB_PASS: petfinder_dev
      DB_NAME: petfinder_test
      SECRET_KEY: test-secret-key-for-ci
      API_BASE_URL: http://127.0.0.1:8001
      PUBLIC_APP_URL: http://127.0.0.1:4173
      FRONTEND_ORIGINS: http://127.0.0.1:4173
      STORAGE_ENABLED: "false"
      TESTING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Prepare backend test environment
        run: cp .env.test.example .env.test

      - name: Install backend dependencies
        run: pip install -r requirements-ci.txt

      - name: Run Ruff
        run: python -m ruff check app tests scripts

      - name: Run backend tests
        run: python -m pytest -m "unit or integration"

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: petfinder_test
          POSTGRES_USER: petfinder
          POSTGRES_PASSWORD: petfinder_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petfinder -d petfinder_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: petfinder
      DB_PASS: petfinder_dev
      DB_NAME: petfinder_test
      SECRET_KEY: test-secret-key-for-ci
      API_BASE_URL: http://127.0.0.1:8001
      PUBLIC_APP_URL: http://127.0.0.1:4173
      FRONTEND_ORIGINS: http://127.0.0.1:4173
      STORAGE_ENABLED: "false"
      TESTING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare backend test environment
        run: cp .env.test.example .env.test

      - name: Install backend dependencies
        run: pip install -r requirements-ci.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E scenarios
        working-directory: frontend
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose
        run: docker compose config

      - name: Build backend image
        run: docker build --tag pet-finder-backend:test .

      - name: Build frontend image
        run: docker build --tag pet-finder-frontend:test ./frontend
