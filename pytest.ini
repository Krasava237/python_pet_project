[pytest]
testpaths = tests
addopts = --strict-markers --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml:coverage-backend.xml --cov-fail-under=55
asyncio_mode = auto
markers =
    unit: Быстрые модульные тесты без внешней инфраструктуры.
    integration: Интеграционные тесты FastAPI и БД.
    e2e: Сквозные пользовательские сценарии.
